# ============================================================================
# rustfmt 配置 —— 用途：**让 `cargo fmt --check` 成为 PR 门禁**
#
# 这个文件的存在**不是**为了改变代码风格，而是把「格式」从
# 「谁想起来谁手动跑」变成「CI 强制判定」。见 .github/workflows/pr-check.yml
# 的 `Format check` 步骤。
#
# ---------------------------------------------------------------------------
# ⚠️ 为什么只写这两个键？
#
# rustfmt 的配置分两类：
#   · **stable**：任何 channel 都能用
#   · **nightly only**：写在 rustfmt.toml 里会被**静默忽略**，只打一行
#     `Warning: can't set XXX, unstable features are only available in
#     nightly channel.`。配置看起来生效了，实际没有。
#
# 本文件**刻意只保留 stable 键**，不写任何 nightly 键。理由：CI 用的是
# stable toolchain（`actions-rust-lang/setup-rust-toolchain@v1` 默认），
# 写了 nightly 键只会让每一轮 CI 刷 warning，并制造「已经配好了」的错觉。
#
# 曾经考虑过但**已移除**的键（记在这里以免后人重新踩）：
#   · `group_imports = "StdExternalCrate"` —— nightly。stable 下不生效，
#     所以本仓的 `use` 区维持既有排布（实测格式化后import 只被**折行**、
#     没有被重排）。想真按 std/外部/crate 分组，要么统一上 nightly 并在
#     CI 固定 `nightly` toolchain，要么手工整理（191 文件，不建议顺手做）。
#   · `wrap_comments = false` / `format_code_in_doc_comments = false` ——
#     本来就是 **stable 默认值**，stable 下写了也报 warning。同上。
#     ★ 这两条的**意图**很关键：本仓注释里有大量中英混排的 ASCII 图与
#     对齐表格，一旦哪天真上了 nightly 并开启自动换行，会把它们拆成
#     错位碎片，比不格式化更糟。上 nightly 时必须保持这两条关闭。
#   · `error_on_line_overflow = false` —— 同为 stable 默认值，且打开它
#     对本仓的长注释/长字符串场景只是噪音。
#
# ---------------------------------------------------------------------------
# ⚠️ 为什么 `max_width` 就钉在 100，不放宽？
#
# 实测（2026-10-16，格式化前基线 173/201 个 .rs 文件不干净）：
#
#   max_width=100 → 1675 处违规
#   max_width=110 → 1745 处违规
#   max_width=120 → 2369 处违规
#   max_width=140 → 3267 处违规
#
# **放宽只会更糟**，因为本仓是混合风格：链式调用里一部分已经按 100 折过、
# 一部分是长单行。100 是拟合最好的点，不存在「换个配置就干净」的写法。
#
# 显式写出 100（而非依赖默认值）——**显式优于隐式**：将来若升级 rustfmt
# 改了默认值，这里仍钉住同一标准，门禁不会突然多出几百处 diff。
#
# 行宽实测分布（格式化前）：p50=33 · p90=69 · p99=94 · max=366。
# p99 只有 94，说明 100 对绝大多数代码宽松；那366 列的单行会折，折了更好读。
# ============================================================================
max_width = 100

# `use` 语句在文件内按字典序重排（stable 下只排**单段**内，不分组）。
# 与 import 折行不同，这项**确实生效**——它解决的是「新增的 use 没插到
# 正确位置」这类漂移，而不是重排既有分组。
reorder_imports = true